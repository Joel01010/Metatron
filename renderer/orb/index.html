<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Metatron Presence Orb</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f8e7d1;font:13px/1.4 system-ui,Segoe UI,sans-serif}
  body{background:radial-gradient(circle at 50% 45%,rgba(75,18,25,.16),rgba(0,0,0,0) 42%)}
  #orb{position:fixed;inset:0;width:100%;height:100%;display:block;background:transparent;touch-action:none}
  #hud{position:fixed;left:14px;bottom:12px;display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid rgba(255,207,114,.18);border-radius:999px;background:rgba(18,8,10,.22);backdrop-filter:blur(8px);opacity:.74;user-select:none}
  #dot{width:7px;height:7px;border-radius:50%;background:#ffd36c;box-shadow:0 0 12px #ffbd4a}
  #state{letter-spacing:.09em;text-transform:uppercase;font-size:10px}
  #help{position:fixed;right:12px;bottom:12px;opacity:.42;font-size:10px;user-select:none;text-align:right}
  @media (max-width:520px){#help{display:none}}
</style>
</head>
<body>
<canvas id="orb" aria-label="Metatron procedural presence orb"></canvas>
<div id="hud"><span id="dot"></span><span id="state">idle · balanced</span></div>
<div id="help">Move pointer for parallax · Click to simulate user speech · Shift+click for AI speech</div>
<script src="orb-renderer.js"></script>
</body>
</html>
