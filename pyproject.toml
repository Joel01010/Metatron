[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metatron-ai-console"
version = "1.4.0"
description = "Open-source, memory-first Windows AI operations console with NPU-first acceleration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Metatron contributors"}]
keywords = ["ai", "npu", "windows", "tauri", "speech-to-text", "agents", "kanban"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
intel = ["openvino>=2026.0"]

[project.scripts]
metatron-backend = "metatron.main:main"

[tool.setuptools.packages.find]
include = ["metatron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest scratch data inside the checkout instead of a possibly stale/locked %TEMP%.
# This remains portable: on the reference Z: checkout it naturally resolves to Z:\...\.pytest-tmp.
addopts = "-q --basetemp=.pytest-tmp"
tmp_path_retention_policy = "failed"
