[package]
name = "metatron"
version = "1.1.0"
description = "Metatron local-first AI operations console"
authors = ["Metatron contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
